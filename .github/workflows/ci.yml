name: ci

on:
  push:
    paths-ignore:
    - 'doc/**'
    - 'img/**'
    - 'readme.md'
  pull_request:

jobs:
  build:
    permissions:
      contents: write
      id-token: write
    runs-on: windows-latest

    steps:
    - name: Build, Test, Pack, Publish
      uses: xoofx/.github/.github/actions/dotnet-releaser-action@main
      with:
        dotnet-version: '10.0.x'
        dotnet-releaser-version: '0.24.1'
        # The action still requires this legacy input; empty enables TOML-based OIDC.
        NUGET_TOKEN: ''
