name: ci-publish_nplug_validator

on:
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0

    - name: Install .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build
      shell: bash
      run: |
        dotnet build -c Release ./src/NPlug.Validator/NPlug.Validator.csproj

    - name: Package
      shell: bash
      run: |
        dotnet pack -c Release ./src/NPlug.Validator/NPlug.Validator.csproj -p:IsPackable=true

    - name: Authenticate to NuGet
      id: nuget
      uses: NuGet/login@v1
      with:
        user: xoofx

    - name: Publish
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push ./src/NPlug.Validator/bin/Release/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
